<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout | EAZY VIBES</title>

    <!-- LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <!-- CSS -->
    <link rel="stylesheet" href="/css/components/profile-header.css">
    <link rel="stylesheet" href="/css/payment.css">
</head>
<body>

<div th:replace="components/profile-header :: profile-header"></div>

<main class="main">
    <h1 class="title">CHECKOUT</h1>

    <div class="checkout-container">
        <!-- LEFT -->
        <div class="checkout-form">
            <h2>Thông tin giao hàng</h2>

            <input id="address" placeholder="Địa chỉ giao hàng">
            <input id="phone" placeholder="Số điện thoại">

            <select id="payment">
                <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                <option value="VNPAY">Thanh toán VNPAY</option>
            </select>

            <!-- VOUCHER -->
            <div class="voucher-box">
                <input id="voucher" placeholder="Nhập mã giảm giá">
                <button onclick="applyVoucher()">Áp dụng</button>
            </div>

            <p id="discountText"></p>

            <button class="btn-order" id="btn-place-order" onclick="placeOrder()">
                ĐẶT HÀNG
            </button>
        </div>

        <!-- RIGHT -->
        <div class="summary">
            <h2>ĐƠN HÀNG</h2>
            <div id="orderItems"></div>
            <hr style="border: 0.5px solid #eee; margin: 20px 0;">
            <p><span>Tạm tính</span> <b id="originalPrice">0 ₫</b></p>
            <p><span>Giảm giá</span> <b id="discount">0 ₫</b></p>
            <p style="font-size: 18px; margin-top: 15px;"><span>Tổng tiền</span> <b id="totalPrice" style="color: #000;">0 ₫</b></p>
        </div>
    </div>
</main>

<script src="/js/components/profile-header.js"></script>
<script src="/js/payment.js"></script>

</body>
</html>
