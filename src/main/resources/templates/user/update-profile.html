<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Profile | EAZY VIBES</title>

    <!-- LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/components/profile-header.css">
    <link rel="stylesheet" href="/css/update-profile.css">

    <style>
        /* --- CUSTOM NOTIFICATION STYLE --- */
        .ez-swal-popup {
            border-radius: 0px !important;
            border: 1px solid #000 !important;
            background-color: #fff !important;
            font-family: 'Inter', sans-serif !important;
        }
        .ez-swal-title {
            font-family: 'Space Grotesk', sans-serif !important;
            font-weight: 900 !important;
            color: #000 !important;
            text-transform: uppercase;
            letter-spacing: -1px;
        }
        .ez-swal-confirm {
            background-color: #000 !important;
            color: #fff !important;
            border-radius: 0px !important;
            font-weight: 900 !important;
            padding: 12px 30px !important;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div th:replace="components/profile-header :: profile-header"></div>

<main class="main">

    <h1 class="title">UPDATE PROFILE</h1>

    <div class="card">

        <!-- AVATAR -->
        <div class="profile-avatar-box">
            <div class="img-wrapper">
                <img id="previewAvatar" src="/images/default-avatar.png" alt="avatar">
            </div>
            <div class="upload-info">
                <label for="avatarInput" class="custom-file-upload">Thay đổi ảnh đại diện</label>
                <input type="file" id="avatarInput" accept="image/*">
            </div>
        </div>

        <!-- FORM -->
        <div class="form">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Nhập họ tên mới">

            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="Số điện thoại của bạn">
            <p id="phoneError" class="error"></p>

            <label>Delivery Address</label>
            <textarea id="address" placeholder="Địa chỉ nhận hàng mặc định"></textarea>

            <button id="btnUpdate">SAVE CHANGES</button>
        </div>
        <p id="errorMsg" class="error" style="text-align: center; margin-top: 15px;"></p>
    </div>

</main>

<script src="/js/components/profile-header.js"></script>
<script src="/js/update-profile.js"></script>
</body>
</html>
