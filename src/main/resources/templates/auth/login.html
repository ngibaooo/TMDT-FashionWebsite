<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐĂNG NHẬP | EAZY VIBES</title>
    
    <!-- LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- THÊM MATERIAL ICONS CHO CON MẮT -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/auth/auth.css">
</head>
<body>
<div class="container">
    <div class="left">
        <!-- BIẾN TEXT TRANG TRÍ THÀNH LOGO LINK -->
        <a th:href="@{/}" class="big-logo-link">
            <h1>EAZY<br>VIBES</h1>
        </a>
    </div>

    <div class="right">
        <h2>ĐĂNG NHẬP</h2>
        <div class="input-group">
            <input type="text" id="username" placeholder="Email hoặc SĐT" required>
        </div>
        
        <!-- FIX: Thêm class password-wrapper đã có trong CSS của bạn -->
        <div class="input-group password-wrapper">
            <input type="password" id="password" placeholder="Mật khẩu" required>
            <!-- ICON CON MẮT -->
            <span class="material-symbols-outlined toggle-password" onclick="togglePasswordVisibility()">visibility</span>
        </div>

        <button id="btn-login" onclick="login()">ĐĂNG NHẬP</button>
        <!-- DIVIDER -->
        <div class="divider">
            <span>HOẶC</span>
        </div>

        <!-- SOCIAL LOGIN -->
        <div class="social-login">
            <button class="btn-google" onclick="loginWithGoogle()">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="google">
                <span>Tiếp tục với Google</span>
            </button>
        </div>
        
        <p>Chưa có tài khoản?</p>
        <a th:href="@{/register}">Tạo tài khoản</a>
    </div>
</div>

<script src="/js/auth/login.js"></script>
</body>
</html>
